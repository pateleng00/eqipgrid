# Server Configuration
server.port=0

# Spring Application
spring.application.name=equipgrid-power-test

# H2 In-Memory Database (PostgreSQL Mode)
spring.datasource.url=jdbc:h2:mem:equipgrid_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA & Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false

# Flyway disabled for unit/integration tests
spring.flyway.enabled=false

# EquipGrid JWT & UPI Settings
equipgrid.jwt.secret=Z2lnc2V2LXN1cGVyLXNlY3JldC1rZXktZm9yLWRldi1vbmx5LWNoYW5nZS1pbi1wcm9k
equipgrid.jwt.expiration-ms=3600000
equipgrid.upi.vpa=equipgrid@upi
equipgrid.upi.payee-name=EquipGrid Agro and Civil Rentals

# AWS S3 Configuration
aws.s3.access-key=dummy-test-access-key
aws.s3.secret-key=dummy-test-secret-key-1234567890
aws.s3.region=ap-south-1
aws.s3.tmp-bucket-name=equipgrid-tmp-test
aws.s3.common-bucket-name=equipgrid-assets-test
aws.s3.signed-url-expiry-minutes=60
