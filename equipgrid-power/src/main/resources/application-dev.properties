spring.datasource.url=jdbc:postgresql://localhost:5432/equipgrid_dev
spring.datasource.username=postgres
spring.datasource.password=postgres

# Local AWS credentials for development
aws.s3.access-key=${AWS_S3_ACCESS_KEY:}
aws.s3.secret-key=${AWS_S3_SECRET_KEY:}
aws.s3.region=${AWS_S3_REGION:ap-south-1}
aws.s3.tmp-bucket-name=${AWS_S3_TMP_BUCKET_NAME:equipgrid-tmp-dev}
aws.s3.common-bucket-name=${AWS_S3_COMMON_BUCKET_NAME:equipgrid-assets-dev}
aws.s3.signed-url-expiry-minutes=1440

