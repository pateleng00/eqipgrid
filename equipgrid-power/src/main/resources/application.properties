equipgrid.ratelimiter.default-duration-seconds=60

# ─── Invisible Bot Shield (Cloudflare Turnstile) ───────────────────────────
equipgrid.botshield.turnstile.enabled=true
equipgrid.botshield.turnstile.secret-key=${TURNSTILE_SECRET_KEY:1x0000000000000000000000000000000AA}
