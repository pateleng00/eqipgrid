# Server Configuration
server.port=8081

# Spring Application
spring.application.name=equipgrid-power

server.servlet.context-path=/equipgrid

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database & Connection Pool (HikariCP)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=EquipGridHikariCP

# JPA & Hibernate
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# EquipGrid Core Security & Business Settings
equipgrid.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
equipgrid.jwt.expiration-ms=86400000
equipgrid.dealer.default-commission-rate=0.06
equipgrid.logistics.base-radius-km=5.0

# EquipGrid UPI Configuration (WhatsApp Rural Service)
equipgrid.upi.vpa=${EQUIPGRID_UPI_VPA:9984698008@upi}
equipgrid.upi.payee-name=Akash Kumar

# SpringDoc OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs

# ─── AWS S3 — Object Storage ────────────────────────────────────────────────
aws.s3.access-key=${AWS_S3_ACCESS_KEY:${AWS_ACCESS_KEY_ID:}}
aws.s3.secret-key=${AWS_S3_SECRET_KEY:${AWS_SECRET_ACCESS_KEY:}}
aws.s3.region=${AWS_S3_REGION:${AWS_REGION:ap-south-1}}
aws.s3.tmp-bucket-name=${AWS_S3_TMP_BUCKET_NAME:equipgrid-tmp-dev}
aws.s3.common-bucket-name=${AWS_S3_COMMON_BUCKET_NAME:equipgrid-assets-dev}
aws.s3.signed-url-expiry-minutes=60

# ─── Multipart / File Upload Limits ────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ─── Gemini Intelligence Engine Configuration ───────────────────────────────
equipgrid.intelligence.gemini.api-key=${GEMINI_API_KEY:}
equipgrid.intelligence.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

