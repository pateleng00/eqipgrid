# ─── Mobile OTP Pre-Validation Barrier ──────────────────────────────────────
equipgrid.otp.enabled=true
equipgrid.otp.expiry-minutes=5
equipgrid.otp.proof-token-expiry-minutes=15
equipgrid.otp.dev-bypass-code=${EQUIPGRID_OTP_DEV_BYPASS:}

