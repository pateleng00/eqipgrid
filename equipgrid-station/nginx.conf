# ─────────────────────────────────────────────────────────────────────────────
# EquipGrid Monolith — Nginx Reverse Proxy with SSL (HTTPS) Configuration
# Handles: Station Frontend SPA (Port 80/443) + Power Backend API (Port 8081)
# ─────────────────────────────────────────────────────────────────────────────

# 1. HTTP Server — Redirects all HTTP traffic to secure HTTPS
server {
    listen 80;
    server_name station.equipgrid.in www.station.equipgrid.in;

    # Let's Encrypt ACME challenge location (for automated renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server — Secure SSL/TLS reverse proxy
server {
    listen 443 ssl;
    server_name station.equipgrid.in www.station.equipgrid.in;

    root /usr/share/nginx/html;
    index index.html;

    # SSL Certificates (mounted from /etc/letsencrypt on host)
    ssl_certificate /etc/letsencrypt/live/station.equipgrid.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/station.equipgrid.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # SPA Client-Side Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API requests to Spring Boot container (power-backend:8081)
    location /equipgrid/ {
        proxy_pass http://power-backend:8081/equipgrid/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # Backward-compatible API aliases (/power/ and /api/)
    location /power/ {
        proxy_pass http://power-backend:8081/equipgrid/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://power-backend:8081/equipgrid/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Assets Caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }
}
