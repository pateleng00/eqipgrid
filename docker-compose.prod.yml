services:
  # ─── 1. Power Backend (Spring Boot 3 + Java 21) ──────────────────────────────
  power-backend:
    build:
      context: ./equipgrid-power
      dockerfile: Dockerfile
    container_name: equipgrid-power-backend
    restart: always
    environment:
      SERVER_PORT: 8081
      SERVER_SERVLET_CONTEXT_PATH: /equipgrid
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/application-prod.properties
    volumes:
      - ${CONFIG_DIR:-/opt/equipgrid/config}/application-prod.properties:/app/config/application-prod.properties:ro
    networks:
      - equipgrid-network
    expose:
      - "8081"

  # ─── 2. Station Frontend (React Vite SPA + Nginx Reverse Proxy) ──────────────
  station-frontend:
    build:
      context: ./equipgrid-station
      dockerfile: Dockerfile
    container_name: equipgrid-station-frontend
    restart: always
    depends_on:
      - power-backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount SSL certificates if using Let's Encrypt directly on the host
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - equipgrid-network

networks:
  equipgrid-network:
    name: equipgrid-network
    driver: bridge
