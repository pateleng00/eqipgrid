services:
  # ─── 1. Power Backend (Spring Boot 3 + Java 21) ──────────────────────────────
  power-backend:
    build:
      context: ./equipgrid-power
      dockerfile: Dockerfile
    container_name: equipgrid-power-backend
    restart: always
    environment:
      SERVER_PORT: 8081
      SERVER_SERVLET_CONTEXT_PATH: /equipgrid
      # AWS S3 Object Storage
      AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY:-}
      AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY:-}
      AWS_S3_REGION: ${AWS_S3_REGION:-ap-south-1}
      AWS_S3_TMP_BUCKET_NAME: ${AWS_S3_TMP_BUCKET_NAME:-equipgrid-tmp-prod}
      AWS_S3_COMMON_BUCKET_NAME: ${AWS_S3_COMMON_BUCKET_NAME:-equipgrid-assets-prod}
      # Gemini AI (Optional)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - equipgrid-network
    expose:
      - "8081"

  # ─── 2. Station Frontend (React Vite SPA + Nginx Reverse Proxy) ──────────────
  station-frontend:
    build:
      context: ./equipgrid-station
      dockerfile: Dockerfile
    container_name: equipgrid-station-frontend
    restart: always
    depends_on:
      - power-backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount SSL certificates if using Let's Encrypt directly on the host
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - equipgrid-network

networks:
  equipgrid-network:
    name: equipgrid-network
    driver: bridge
